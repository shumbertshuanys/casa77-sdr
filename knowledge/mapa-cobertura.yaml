# Mapa de grupos de cobertura — R2.
#
# Autoridade: docs/07 §4.4.1 (R2-1–R2-8) e §4.4.2 (R2F-1–R2F-15).
# Mapeamento TOTAL: os 54 AssuntoComercial de AJ2, cada um exatamente uma vez.
#
# Este artefato guarda REFERENCIA ESTRUTURAL — `rxx` + `fragmento` — e nada
# mais: sem priority, texto, status, binding, caminho_yaml, predicado,
# formato ou valor comercial. Conjuncao entre grupos, disjuncao dentro do
# grupo. `grupos: []` diz **sem cobertura aprovada**, de proposito.
#
# R2-8 (R2-SUF): uma associacao so e admissivel quando os fragmentos
# aprovados respondem INTEGRALMENTE a extensao semantica do assunto.
